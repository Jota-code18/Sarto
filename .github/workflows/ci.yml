name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  padrao:
    name: Issue e commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR menciona a issue
        env:
          CORPO: ${{ github.event.pull_request.body }}
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          [ "$AUTOR" = "dependabot[bot]" ] || printf '%s' "$CORPO" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) #[0-9]+' || { echo "::error::Mencione a issue na descrição: Closes #N ou Refs #N"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx commitlint --from "$BASE" --to "$TOPO" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run arquitetura
      - run: npm run morto
      - run: npm test
      - run: npm run build
