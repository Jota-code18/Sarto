name: Atualizar carteira
# Toda segunda às 5h (Brasília), antes da reunião das 9h. Também roda na mão.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  carteira:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/atualizar-carteira.mjs
      - name: Gravar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/carteira.json
          git diff --cached --quiet || (git commit -m "Atualiza carteira do site" && git push)
